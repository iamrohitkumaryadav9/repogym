# Pinned model settings (D10). Sampling and thinking follow each vendor's documented defaults:
#   Gemini 3.x: "we strongly recommend not changing the default values" for temperature/top_p/top_k
#     (https://aistudio.google.com/llms-full.txt, checked 2026-11-09); Flash-Lite's default
#     thinking_level is "minimal" (https://aistudio.google.com/docs/thinking.md?generate-content=true).
#   Gemma 4: temperature=1.0 top_p=0.95 top_k=64 (https://ai.google.dev/gemma/docs/core/model_card_4,
#     last updated 2026-07-30). Thinking: API default (thinks by default; measured 2026-11-09).
# Prompt size: always the calibrated estimator, corrected for Gemma's re-billed thinking (D21).
# countTokens is never called in timed runs (D20); `token_counting` other than "estimate" is
# refused when an experiment loads.
checked: "2026-11-09"
models:
  gemini-3.5-flash-lite:
    provider: gemini
    sampling: {}
    thinking_level: minimal
    max_output_tokens: 8192
  gemma-4-31b-it:
    provider: gemini
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    thinking_level: null
    max_output_tokens: 8192
  gemma-4-26b-a4b-it:
    provider: gemini
    sampling: {temperature: 1.0, top_p: 0.95, top_k: 64}
    thinking_level: null
    max_output_tokens: 8192
  # Candidate replacement for gemma-4-31b-it (pilot only). ID verified with models.list on
  # 2026-11-09: models/gemini-3.1-flash-lite, version 3.1-flash-lite-05-2026 (stable; a
  # -preview also exists). Thinking per D22: the Gemini docs' recommendation for coding tasks
  # is high; "Gemini 3.5 & 3.1 Flash-Lite" support minimal (default), low, medium, high.
  gemini-3.1-flash-lite:
    provider: gemini
    sampling: {}
    thinking_level: high
    max_output_tokens: 8192
