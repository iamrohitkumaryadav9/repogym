# Week 3 re-pilot: the fixed agent (D19, D21) on new dev tasks, before Gate 2.
# Dev tasks only; tagged pilot in provenance; excluded from every later analysis.
#
# Tasks (stratified across repos, fixed rule): the alphabetically first dev task of each repo
# the first pilot didn't use, plus the alphabetically first unused task of the largest repo:
#   python-attrs/attrs -> python-attrs__attrs-1448
#   python-poetry/tomlkit -> python-poetry__tomlkit-536
#   pallets/click (8 dev tasks; click-3473 was used) -> pallets__click-3504
# Models: Flash-Lite and Gemma 26B (6 episodes). Flash-Lite runs after its daily quota reset
# (`repogym run --experiment ... --models gemini-3.5-flash-lite`), so it can't run out mid-episode.
name: week3-repilot
kind: pilot
split: dev
release: v0.1
tasks:
  - python-attrs__attrs-1448
  - python-poetry__tomlkit-536
  - pallets__click-3504
models:
  - gemma-4-26b-a4b-it
  - gemini-3.5-flash-lite
strategies: [obs_mask]
repeats: 1
context:
  budget: 12000
  clip_tokens: 2000
  keep_observations: 5
  keep_recent_units: 4
  summary_trigger: 0.8
  summary_max_tokens: 1000
budgets:
  max_steps: 75
  max_wall_seconds: 3600  # active time only (D17)
  max_elapsed_seconds: 21600  # hung-episode safety net; hitting it = api_failure
  max_observation_chars: 200000  # storage cap, not the model's view (D14)
  max_total_observation_chars: 20000000
