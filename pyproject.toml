[project]
name = "repogym"
version = "0.1.0"
description = "RL environment and evaluation harness for coding agents, built from real GitHub data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai==2.33.0",
    "httpx>=0.27",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml==6.0.3",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
repogym = "repogym.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repogym"]

[dependency-groups]
dev = [
    "hypothesis==6.170.10",
    "pytest>=8",
    "ruff>=0.5",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need Docker and the local bare clones; run them with `pytest -m docker`.
markers = ["docker: needs Docker and data/repos (excluded by default and in CI)"]
addopts = "-m 'not docker'"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer's Option() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
